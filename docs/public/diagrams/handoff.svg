<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Human handoff flow</title><desc id="d">An agent pauses at an authorization or uncertainty boundary and transfers a structured package to a human reviewer.</desc>
<defs><style>.t{font:700 28px Inter,Arial}.h{font:700 19px Inter,Arial}.b{font:400 16px Inter,Arial;fill:#334155}.n{fill:white;stroke:#4f46e5;stroke-width:2.5}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.ok{fill:#ecfeff;stroke:#0f766e;stroke-width:3}</style></defs>
<rect width="1200" height="640" rx="28" fill="#f8fafc"/>
<text x="55" y="55" class="t" fill="#0f172a">A handoff is a state transfer, not a conversation dump</text>
<rect x="70" y="130" width="220" height="90" rx="17" class="n"/><text x="120" y="168" class="h">Agent work</text><text x="105" y="198" class="b">investigate and prepare</text>
<rect x="365" y="130" width="250" height="90" rx="17" class="warn"/><text x="412" y="168" class="h">Boundary detected</text><text x="400" y="198" class="b">authority, risk, or ambiguity</text>
<rect x="690" y="130" width="220" height="90" rx="17" class="ok"/><text x="730" y="168" class="h">Pause action</text><text x="725" y="198" class="b">do not guess or exceed scope</text>
<rect x="980" y="130" width="150" height="90" rx="17" class="ok"/><text x="1010" y="168" class="h">Human</text><text x="1005" y="198" class="b">decides / acts</text>
<path d="M290 175h75M615 175h75M910 175h70" stroke="#64748b" stroke-width="4"/>
<rect x="200" y="320" width="800" height="205" rx="22" fill="#fff" stroke="#0f766e" stroke-width="3"/>
<text x="250" y="365" class="h">Structured handoff package</text>
<text x="250" y="410" class="b">• verified identity and stable record IDs</text><text x="250" y="445" class="b">• request, evidence, completed actions, and current state</text><text x="250" y="480" class="b">• reason for escalation, uncertainty, and recommended next step</text>
<text x="660" y="410" class="b">• permissions already granted</text><text x="660" y="445" class="b">• failures, retry history, and safety constraints</text><text x="660" y="480" class="b">• audit reference and source provenance</text>
<path d="M600 220v100" stroke="#0f766e" stroke-width="4"/>
<text x="70" y="590" class="b" fill="#0f766e">Respect explicit human requests immediately; avoid forcing the user to repeat information already available.</text>
</svg>
