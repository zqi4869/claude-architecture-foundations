<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">MCP multi-server architecture</title><desc id="d">A Claude application connects to multiple MCP servers with per-tool policies and authentication boundaries.</desc>
<defs><style>.t{font:700 28px Inter,Arial}.h{font:700 20px Inter,Arial}.b{font:400 16px Inter,Arial;fill:#334155}.app{fill:#ecfeff;stroke:#0f766e;stroke-width:3}.srv{fill:white;stroke:#4f46e5;stroke-width:2.5}.ctl{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}</style></defs>
<rect width="1200" height="680" rx="28" fill="#f8fafc"/>
<text x="55" y="55" class="t" fill="#0f172a">MCP connects capabilities without erasing boundaries</text>
<rect x="390" y="95" width="420" height="100" rx="20" class="app"/><text x="475" y="136" class="h">Claude application / client</text><text x="455" y="169" class="b">Discovers enabled tools and routes typed calls</text>
<rect x="80" y="300" width="285" height="125" rx="18" class="srv"/><text x="150" y="340" class="h">Git server</text><text x="120" y="374" class="b">create_branch</text><text x="120" y="400" class="b">open_pull_request</text>
<rect x="455" y="300" width="290" height="125" rx="18" class="srv"/><text x="535" y="340" class="h">Issue server</text><text x="500" y="374" class="b">get_ticket</text><text x="500" y="400" class="b">update_ticket</text>
<rect x="835" y="300" width="285" height="125" rx="18" class="srv"/><text x="900" y="340" class="h">Docs server</text><text x="875" y="374" class="b">search_docs</text><text x="875" y="400" class="b">fetch_page</text>
<path d="M500 195 260 300M600 195v105M700 195l240 105" stroke="#0f766e" stroke-width="4" fill="none"/>
<rect x="170" y="500" width="860" height="105" rx="18" class="ctl"/><text x="215" y="540" class="h">Control plane</text><text x="410" y="540" class="b">authentication · allowlists · denylists · approval policies · audit</text><text x="215" y="575" class="b">Expose only the tools required for the task. Defer or search large tool surfaces rather than loading everything.</text>
<path d="M260 425v75M600 425v75M975 425v75" stroke="#ea580c" stroke-width="3" stroke-dasharray="7 6"/>
<text x="80" y="650" class="b" fill="#0f766e">Standardized connectivity does not replace least privilege, clear descriptions, or per-tool policy.</text>
</svg>
